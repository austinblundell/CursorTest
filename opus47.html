<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Opus 4.7 — Soft Body Tetris</title>
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="opus47.css">
</head>
<body class="opus-body">
  <nav class="game-nav" aria-label="Switch game">
    <a href="snake.html">Snake</a>
    <a href="minesweeper.html">Minesweeper</a>
    <a href="opus47.html" class="active" aria-current="page">Opus 4.7</a>
  </nav>

  <div class="opus-stage">
    <canvas id="game" aria-label="Opus 4.7 soft body Tetris"></canvas>

    <header class="opus-hud-top">
      <div class="opus-title">
        <h1>Opus 4.7</h1>
        <p>Soft Body Tetris</p>
      </div>
      <div class="opus-stats">
        <div class="opus-stat">
          <span class="label">Score</span>
          <strong id="score">0</strong>
        </div>
        <div class="opus-stat">
          <span class="label">Lines</span>
          <strong id="lines">0</strong>
        </div>
        <div class="opus-stat">
          <span class="label">Level</span>
          <strong id="level">1</strong>
        </div>
      </div>
      <div class="opus-next">
        <span class="label">Next</span>
        <canvas id="next-canvas" width="120" height="120" aria-label="Next piece"></canvas>
      </div>
    </header>

    <p class="opus-hint desktop-hint">
      ← → move &middot; ↑ / X rotate &middot; Z rotate left &middot; ↓ soft drop &middot;
      Space hard drop &middot; P pause &middot; R restart
    </p>

    <div class="mobile-toolbar visible opus-mobile" aria-label="Mobile controls">
      <div class="dpad opus-dpad" aria-label="Direction controls">
        <span class="empty"></span>
        <button type="button" data-action="rotate" aria-label="Rotate">⟳</button>
        <span class="empty"></span>
        <button type="button" data-action="left" aria-label="Move left">◀</button>
        <button type="button" data-action="soft" aria-label="Soft drop">▼</button>
        <button type="button" data-action="right" aria-label="Move right">▶</button>
      </div>
      <div class="mobile-actions">
        <button type="button" data-action="hard">Hard Drop</button>
        <button type="button" data-action="pause">Pause</button>
        <button type="button" data-action="restart">Restart</button>
      </div>
    </div>

    <div id="overlay" class="opus-overlay hidden">
      <div class="overlay-card">
        <h2 id="overlay-title">Paused</h2>
        <p id="overlay-message">Press P to resume.</p>
        <button type="button" id="overlay-button">Resume</button>
      </div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.158.0/build/three.module.js"
      }
    }
  </script>
  <script type="module" src="opus47.js"></script>
</body>
</html>
