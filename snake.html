<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Snake</title>
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <nav class="game-nav" aria-label="Switch game">
      <a href="snake.html" class="active" aria-current="page">Snake</a>
      <a href="minesweeper.html">Minesweeper</a>
      <a href="codex.html">Codex</a>
      <a href="auto.html">Auto</a>
      <a href="gpt55.html">GPT 5.5</a>
      <a href="composer25.html">Composer 2.5</a>
    </nav>

    <header>
      <h1>Snake</h1>
      <div class="stats">
        <span class="stat">Score: <strong id="score">0</strong></span>
        <span class="stat">High: <strong id="high-score">0</strong></span>
      </div>
    </header>

    <div class="game-wrapper">
      <canvas id="game" width="400" height="400" aria-label="Snake game board"></canvas>
      <div id="overlay" class="overlay hidden">
        <p id="overlay-title">Game Over</p>
        <p id="overlay-message">Press Space to play again</p>
      </div>
    </div>

    <p class="controls desktop-hint">Use arrow keys or WASD to move · Space to pause / restart</p>

    <div class="mobile-toolbar visible" aria-label="Mobile controls">
      <p class="mobile-hint">Swipe on the board or use the buttons below</p>
      <div class="dpad" aria-label="Direction controls">
        <span class="empty"></span>
        <button type="button" data-dir="up" aria-label="Up">▲</button>
        <span class="empty"></span>
        <button type="button" data-dir="left" aria-label="Left">◀</button>
        <button type="button" data-dir="down" aria-label="Down">▼</button>
        <button type="button" data-dir="right" aria-label="Right">▶</button>
      </div>
      <div class="mobile-actions">
        <button type="button" id="pause-btn">Pause</button>
        <button type="button" id="play-btn">Play</button>
      </div>
    </div>
  </div>

  <script src="snake.js"></script>
</body>
</html>
