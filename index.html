<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Starfall Saga — A Final Fantasy Tribute</title>
  <link rel="stylesheet" href="css/game.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
  <div id="shell">
    <canvas id="screen" width="512" height="448" aria-label="Starfall Saga game screen"></canvas>
    <div id="mobile-pad" aria-hidden="true">
      <div class="dpad">
        <button type="button" data-dir="up" aria-label="Up">▲</button>
        <div class="dpad-mid">
          <button type="button" data-dir="left" aria-label="Left">◀</button>
          <button type="button" data-dir="down" aria-label="Down">▼</button>
          <button type="button" data-dir="right" aria-label="Right">▶</button>
        </div>
      </div>
      <button type="button" id="btn-a" aria-label="Confirm">A</button>
    </div>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
