<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classic Games</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(ellipse at top, #2d3748 0%, #1a1f2e 60%);
      color: #e2e8f0;
      padding: 1.5rem;
    }

    main {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 0.35rem;
    }

    p {
      color: #94a3b8;
      margin-bottom: 2rem;
    }

    .games {
      display: grid;
      gap: 1rem;
    }

    .game-link {
      display: block;
      padding: 1.25rem 1.5rem;
      border-radius: 12px;
      border: 1px solid #3a4256;
      background: #252b3b;
      color: inherit;
      text-decoration: none;
      transition: transform 0.15s, border-color 0.15s;
    }

    .game-link:hover {
      transform: translateY(-2px);
      border-color: #48bb78;
    }

    .game-link strong {
      display: block;
      font-size: 1.25rem;
      margin-bottom: 0.35rem;
    }

    .game-link span {
      color: #94a3b8;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main>
    <nav class="game-nav" aria-label="Switch game">
      <a href="snake.html">Snake</a>
      <a href="minesweeper.html">Minesweeper</a>
      <a href="auto.html">Auto</a>
    </nav>
    <h1>Classic Games</h1>
    <p>Pick a game to play</p>
    <nav class="games" aria-label="Game selection">
      <a class="game-link" href="snake.html">
        <strong>Snake</strong>
        <span>Eat food, grow longer, avoid your tail</span>
      </a>
      <a class="game-link" href="minesweeper.html">
        <strong>Minesweeper</strong>
        <span>Clear the board without hitting a mine</span>
      </a>
      <a class="game-link" href="auto.html">
        <strong>Auto</strong>
        <span>3D soft-body physics tetris — squish, stack, clear lines</span>
      </a>
    </nav>
  </main>
</body>
</html>
