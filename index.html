<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Crystal Chronicles — A Final Fantasy Tribute</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas" width="512" height="448"></canvas>
    <div id="touch-controls" aria-hidden="true">
      <div class="dpad">
        <button data-dir="up" aria-label="Up">▲</button>
        <div class="dpad-row">
          <button data-dir="left" aria-label="Left">◀</button>
          <button data-dir="down" aria-label="Down">▼</button>
          <button data-dir="right" aria-label="Right">▶</button>
        </div>
      </div>
      <button id="action-btn" aria-label="Confirm">A</button>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
