<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Snake</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      background: radial-gradient(ellipse at top, #1a2f1a 0%, #0d1117 60%);
      color: #e6edf3;
      touch-action: manipulation;
    }
    .container { text-align: center; padding: 1rem; max-width: 100vw; }
    header { margin-bottom: 1rem; }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #7ee787;
      text-shadow: 0 0 24px rgba(126, 231, 135, 0.35);
      margin-bottom: 0.5rem;
    }
    .stats {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      font-size: 0.95rem;
      color: #8b949e;
    }
    .stats strong { color: #e6edf3; font-variant-numeric: tabular-nums; }
    .game-wrapper {
      position: relative;
      display: inline-block;
      border-radius: 12px;
      box-shadow: 0 0 0 2px #30363d, 0 16px 48px rgba(0, 0, 0, 0.5);
    }
    canvas {
      display: block;
      border-radius: 12px;
      background: #161b22;
      max-width: min(92vw, 400px);
      height: auto;
    }
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: rgba(13, 17, 23, 0.82);
      border-radius: 12px;
      backdrop-filter: blur(4px);
    }
    .overlay.hidden { display: none; }
    #overlay-title { font-size: 1.5rem; font-weight: 700; color: #7ee787; }
    #overlay-message { font-size: 0.85rem; color: #8b949e; padding: 0 1rem; }
    .controls { margin-top: 0.75rem; font-size: 0.8rem; color: #6e7681; }
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 3.25rem);
      grid-template-rows: repeat(3, 3.25rem);
      gap: 0.35rem;
      justify-content: center;
      margin-top: 1rem;
    }
    .dpad button {
      border: none;
      border-radius: 10px;
      background: #21262d;
      color: #7ee787;
      font-size: 1.25rem;
      font-weight: 700;
      box-shadow: 0 0 0 1px #30363d;
    }
    .dpad button:active { background: #30363d; }
    .dpad .empty { visibility: hidden; }
    .action-row {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      margin-top: 0.75rem;
    }
    .action-row button {
      border: none;
      border-radius: 10px;
      padding: 0.65rem 1.1rem;
      background: #21262d;
      color: #e6edf3;
      font-size: 0.9rem;
      box-shadow: 0 0 0 1px #30363d;
    }
    .action-row button:active { background: #30363d; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Snake</h1>
      <div class="stats">
        <span class="stat">Score: <strong id="score">0</strong></span>
        <span class="stat">High: <strong id="high-score">0</strong></span>
      </div>
    </header>

    <div class="game-wrapper">
      <canvas id="game" width="400" height="400" aria-label="Snake game board"></canvas>
      <div id="overlay" class="overlay hidden">
        <p id="overlay-title">Game Over</p>
        <p id="overlay-message">Tap Play to start</p>
      </div>
    </div>

    <p class="controls">Swipe on the board or use the buttons below</p>

    <div class="dpad" aria-label="Direction controls">
      <span class="empty"></span>
      <button type="button" data-dir="up" aria-label="Up">▲</button>
      <span class="empty"></span>
      <button type="button" data-dir="left" aria-label="Left">◀</button>
      <button type="button" data-dir="down" aria-label="Down">▼</button>
      <button type="button" data-dir="right" aria-label="Right">▶</button>
    </div>

    <div class="action-row">
      <button type="button" id="pause-btn">Pause</button>
      <button type="button" id="play-btn">Play</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('high-score');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayMessage = document.getElementById('overlay-message');
    const pauseBtn = document.getElementById('pause-btn');
    const playBtn = document.getElementById('play-btn');

    const GRID = 20;
    const CELL = canvas.width / GRID;
    const TICK_MS = 120;

    const DIRECTIONS = {
      ArrowUp: { x: 0, y: -1 },
      ArrowDown: { x: 0, y: 1 },
      ArrowLeft: { x: -1, y: 0 },
      ArrowRight: { x: 1, y: 0 },
      KeyW: { x: 0, y: -1 },
      KeyS: { x: 0, y: 1 },
      KeyA: { x: -1, y: 0 },
      KeyD: { x: 1, y: 0 },
      up: { x: 0, y: -1 },
      down: { x: 0, y: 1 },
      left: { x: -1, y: 0 },
      right: { x: 1, y: 0 },
    };

    let snake;
    let direction;
    let nextDirection;
    let food;
    let score;
    let highScore = Number(localStorage.getItem('snake-high-score') || 0);
    let tickId;
    let paused = false;
    let gameOver = false;
    let started = false;

    highScoreEl.textContent = highScore;

    function initGame() {
      const mid = Math.floor(GRID / 2);
      snake = [
        { x: mid, y: mid },
        { x: mid - 1, y: mid },
        { x: mid - 2, y: mid },
      ];
      direction = { x: 1, y: 0 };
      nextDirection = { ...direction };
      score = 0;
      scoreEl.textContent = score;
      paused = false;
      gameOver = false;
      started = true;
      placeFood();
      hideOverlay();
      clearInterval(tickId);
      tickId = setInterval(tick, TICK_MS);
      draw();
    }

    function placeFood() {
      let spot;
      do {
        spot = {
          x: Math.floor(Math.random() * GRID),
          y: Math.floor(Math.random() * GRID),
        };
      } while (snake.some((segment) => segment.x === spot.x && segment.y === spot.y));
      food = spot;
    }

    function tick() {
      if (paused || gameOver) return;

      direction = nextDirection;
      const head = snake[0];
      const newHead = { x: head.x + direction.x, y: head.y + direction.y };

      if (
        newHead.x < 0 ||
        newHead.x >= GRID ||
        newHead.y < 0 ||
        newHead.y >= GRID ||
        snake.some((segment) => segment.x === newHead.x && segment.y === newHead.y)
      ) {
        endGame();
        return;
      }

      snake.unshift(newHead);

      if (newHead.x === food.x && newHead.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        if (score > highScore) {
          highScore = score;
          highScoreEl.textContent = highScore;
          localStorage.setItem('snake-high-score', String(highScore));
        }
        placeFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function drawCell(x, y, color) {
      const pad = 1;
      ctx.fillStyle = color;
      ctx.fillRect(x * CELL + pad, y * CELL + pad, CELL - pad * 2, CELL - pad * 2);
    }

    function draw() {
      ctx.fillStyle = '#161b22';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      drawCell(food.x, food.y, '#ff7b72');
      snake.forEach((segment, index) => {
        drawCell(segment.x, segment.y, index === 0 ? '#7ee787' : '#3fb950');
      });
    }

    function showOverlay(title, message) {
      overlayTitle.textContent = title;
      overlayMessage.textContent = message;
      overlay.classList.remove('hidden');
    }

    function hideOverlay() {
      overlay.classList.add('hidden');
    }

    function endGame() {
      gameOver = true;
      clearInterval(tickId);
      showOverlay('Game Over', `Score: ${score} · Tap Play to try again`);
    }

    function togglePause() {
      if (gameOver || !started) return;
      paused = !paused;
      if (paused) {
        showOverlay('Paused', 'Tap Pause again to resume');
      } else {
        hideOverlay();
      }
    }

    function setDirection(next) {
      if (!next || gameOver) return;
      const isReverse = next.x === -direction.x && next.y === -direction.y;
      if (!isReverse) nextDirection = next;
      if (paused) {
        paused = false;
        hideOverlay();
      }
    }

    document.addEventListener('keydown', (event) => {
      if (event.code === 'Space') {
        event.preventDefault();
        if (gameOver || !started) initGame();
        else togglePause();
        return;
      }
      const next = DIRECTIONS[event.code];
      if (!next) return;
      event.preventDefault();
      setDirection(next);
    });

    document.querySelectorAll('[data-dir]').forEach((button) => {
      button.addEventListener('click', () => {
        if (!started) initGame();
        setDirection(DIRECTIONS[button.dataset.dir]);
      });
    });

    pauseBtn.addEventListener('click', togglePause);
    playBtn.addEventListener('click', initGame);

    let touchStart = null;
    canvas.addEventListener('touchstart', (event) => {
      touchStart = event.changedTouches[0];
    }, { passive: true });

    canvas.addEventListener('touchend', (event) => {
      if (!touchStart) return;
      const touch = event.changedTouches[0];
      const dx = touch.clientX - touchStart.clientX;
      const dy = touch.clientY - touchStart.clientY;
      touchStart = null;

      if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
      if (!started) initGame();

      if (Math.abs(dx) > Math.abs(dy)) {
        setDirection(dx > 0 ? DIRECTIONS.right : DIRECTIONS.left);
      } else {
        setDirection(dy > 0 ? DIRECTIONS.down : DIRECTIONS.up);
      }
    }, { passive: true });

    showOverlay('Snake', 'Tap Play or swipe to start');
    draw();
  </script>
</body>
</html>
