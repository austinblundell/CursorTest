<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Minesweeper</title>
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <nav class="game-nav" aria-label="Switch game">
      <a href="snake.html">Snake</a>
      <a href="minesweeper.html" class="active" aria-current="page">Minesweeper</a>
      <a href="codex.html">Codex</a>
      <a href="auto.html">Auto</a>
      <a href="gpt55.html">GPT 5.5</a>
      <a href="composer25.html">Composer 2.5</a>
      <a href="opus47.html">Opus 4.7</a>
      <a href="opus48.html">Opus 4.8</a>
      <a href="sonnet46.html">Sonnet 4.6</a>
    </nav>

    <header class="header">
      <h1>Minesweeper</h1>
      <p class="subtitle desktop-hint">Left-click to reveal · Right-click to flag · Double-click numbers to chord</p>
    </header>

    <main class="game-panel">
      <div class="controls">
        <div class="difficulty">
          <label for="difficulty">Difficulty</label>
          <select id="difficulty" aria-label="Difficulty level">
            <option value="beginner">Beginner (9×9, 10 mines)</option>
            <option value="intermediate">Intermediate (16×16, 40 mines)</option>
            <option value="expert">Expert (30×16, 99 mines)</option>
          </select>
        </div>

        <div class="status-bar">
          <div class="counter" id="mine-counter" aria-label="Mines remaining">010</div>
          <button class="face-button" id="reset-button" type="button" aria-label="New game">🙂</button>
          <div class="counter" id="timer" aria-label="Elapsed time">000</div>
        </div>
      </div>

      <div class="board-wrapper">
        <div class="board" id="board" role="grid" aria-label="Minesweeper board"></div>
      </div>

      <div class="mobile-toolbar visible" aria-label="Mobile controls">
        <p class="mobile-hint">Tap a cell to reveal · Long-press to flag · Or pick a mode below</p>
        <div class="mobile-actions">
          <button type="button" id="mode-reveal" class="active" aria-pressed="true">Reveal</button>
          <button type="button" id="mode-flag" aria-pressed="false">Flag</button>
        </div>
      </div>

      <p class="message" id="message" aria-live="polite"></p>
    </main>
  </div>

  <script src="game.js"></script>
</body>
</html>
