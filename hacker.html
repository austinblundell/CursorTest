<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Hacker Terminal — 3D Cyber Intrusion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="hacker.css">
</head>
<body>
  <nav class="game-nav" aria-label="Switch game">
    <a href="snake.html">Snake</a>
    <a href="minesweeper.html">Minesweeper</a>
    <a href="auto.html">Auto</a>
    <a href="gpt55.html">GPT 5.5</a>
    <a href="composer25.html">Composer 2.5</a>
    <a href="opus48.html">Opus 4.8</a>
    <a href="sonnet46.html">Sonnet 4.6</a>
    <a href="hacker.html" class="active" aria-current="page">Hacker</a>
  </nav>

  <canvas id="scene" aria-label="3D hacker terminal animation"></canvas>

  <div class="hud" aria-hidden="true">
    <div class="hud-top">
      <span class="tag">// NIGHTCRAWLER-OS v4.0.4 — INTRUSION SUITE</span>
      <span class="hud-stats">
        <span>TARGET <b id="stat-ip">000.000.000.000</b></span>
        <span>PING <b id="stat-ping">--</b></span>
        <span>NODES <b id="stat-nodes">0</b></span>
        <span>ENC <b id="stat-enc">AES-256</b></span>
      </span>
    </div>
    <span class="corner tl"></span>
    <span class="corner tr"></span>
    <span class="corner bl"></span>
    <span class="corner br"></span>

    <section class="terminal">
      <div class="terminal-bar">
        <span class="dot"></span><span class="dot y"></span><span class="dot g"></span>
        <span class="title">root@nightcrawler:~#</span>
      </div>
      <div class="terminal-body" id="term"></div>
    </section>

    <div class="banner" id="banner"><span class="txt" data-text="" id="banner-text"></span></div>
  </div>

  <div class="scanlines"></div>
  <div class="vignette"></div>
  <div class="flicker"></div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="hacker.js"></script>
</body>
</html>
