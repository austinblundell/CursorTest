<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Codex</title>
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="codex.css">
</head>
<body>
  <main class="codex-app">
    <nav class="game-nav" aria-label="Switch game">
      <a href="snake.html">Snake</a>
      <a href="minesweeper.html">Minesweeper</a>
      <a href="codex.html" class="active" aria-current="page">Codex</a>
          <a href="sonnet46.html">Sonnet 4.6</a>
    </nav>

    <header class="codex-header">
      <h1>Codex</h1>
      <p>3D Soft-Body Physics Tetris</p>
    </header>

    <section class="hud" aria-label="Game stats">
      <div class="stat-box">
        <span class="label">Score</span>
        <strong id="score">0</strong>
      </div>
      <div class="stat-box">
        <span class="label">Lines</span>
        <strong id="lines">0</strong>
      </div>
      <div class="stat-box">
        <span class="label">Level</span>
        <strong id="level">1</strong>
      </div>
      <div class="stat-box">
        <span class="label">Next</span>
        <strong id="next-piece">-</strong>
      </div>
    </section>

    <section class="stage-wrap" aria-label="Codex stage">
      <div id="stage" class="stage"></div>
      <div id="overlay" class="overlay hidden" aria-live="polite">
        <h2 id="overlay-title">Paused</h2>
        <p id="overlay-message">Press P to resume</p>
      </div>
    </section>

    <section class="help">
      <p><strong>Move:</strong> A / D / W / S · <strong>Rotate:</strong> Q / E · <strong>Drop:</strong> ↓ · <strong>Hard Drop:</strong> Space</p>
      <p><strong>Pause:</strong> P · <strong>Restart:</strong> Enter</p>
    </section>
  </main>

  <script type="module" src="codex.js"></script>
</body>
</html>
